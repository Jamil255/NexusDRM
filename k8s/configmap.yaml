apiVersion: v1
kind: ConfigMap
metadata:
  name: drms-config
  namespace: drms
  labels:
    app.kubernetes.io/name: drms-api
    app.kubernetes.io/component: config
    app.kubernetes.io/part-of: drms-platform
data:
  # Application
  APP_NAME: "DRMS"
  APP_PORT: "3000"
  APP_ENV: "production"
  API_PREFIX: "api/v1"
  APP_CORS_ORIGINS: "https://drms.example.com"

  # Database
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_USERNAME: "drms_user"
  DB_DATABASE: "drms_db"
  DB_SYNCHRONIZE: "false"
  DB_LOGGING: "false"

  # S3 / MinIO
  S3_ENDPOINT: "http://minio-service:9000"
  S3_BUCKET_RAW: "drms-raw-content"
  S3_BUCKET_ENCRYPTED: "drms-encrypted-content"
  S3_BUCKET_THUMBNAILS: "drms-thumbnails"
  S3_REGION: "us-east-1"
  S3_FORCE_PATH_STYLE: "true"

  # PgBoss
  PGBOSS_SCHEMA: "pgboss"
  PGBOSS_ARCHIVE_INTERVAL_DAYS: "7"

  # Encryption
  CONTENT_ENCRYPTION_ALGORITHM: "aes-256-gcm"

  # Rate Limiting
  RATE_LIMIT_GLOBAL_MAX: "100"
  RATE_LIMIT_GLOBAL_WINDOW_MS: "60000"
  RATE_LIMIT_AUTH_MAX: "5"
  RATE_LIMIT_AUTH_WINDOW_MS: "60000"

  # JWT
  JWT_ACCESS_EXPIRATION: "15m"
  JWT_REFRESH_EXPIRATION: "7d"

  # Signed URL
  SIGNED_URL_DEFAULT_TTL: "900"
  SIGNED_URL_STREAM_TTL: "3600"
